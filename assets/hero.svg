<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05070D"/>
      <stop offset="45%"  stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#6C63FF" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#6C63FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C4B5FD"/>
      <stop offset="45%"  stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="50%"  stop-color="#DDE3FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineglow" filterUnits="userSpaceOnUse" x="240" y="150" width="740" height="76">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#halo)"/>

  <g stroke="#6C63FF" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <g fill="none" stroke="url(#boltGrad)" stroke-width="2.4" stroke-linejoin="round"
     stroke-linecap="round" filter="url(#glow)">
    <path d="M148 -10 L128 96 L166 88 L132 214 L150 120 L112 130 Z" opacity="0">
      <animate attributeName="opacity"
        values="0;0.95;0.15;1;0.3;0;0;0;0;0"
        keyTimes="0;0.02;0.04;0.06;0.09;0.12;0.4;0.7;0.9;1"
        dur="5.5s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M1052 -10 L1078 88 L1040 82 L1074 210 L1052 118 L1092 126 Z" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.9;0.2;1;0.25;0;0;0;0"
        keyTimes="0;0.28;0.31;0.33;0.35;0.38;0.42;0.7;0.9;1"
        dur="5.5s" begin="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M300 300 L286 224 L318 232 L292 138" opacity="0" stroke-width="1.8">
      <animate attributeName="opacity"
        values="0;0;0.7;0.1;0.85;0;0;0;0"
        keyTimes="0;0.5;0.53;0.55;0.57;0.61;0.8;0.95;1"
        dur="5.5s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M902 302 L916 226 L884 234 L910 142" opacity="0" stroke-width="1.8">
      <animate attributeName="opacity"
        values="0;0;0;0.8;0.15;0.9;0;0;0"
        keyTimes="0;0.6;0.63;0.66;0.68;0.7;0.74;0.95;1"
        dur="5.5s" begin="2.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#softglow)">
    <text x="600" y="158" text-anchor="middle"
          font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-weight="900" font-size="72" letter-spacing="10" fill="url(#nameGrad)">
      AJANEESHWAR
      <animate attributeName="opacity" values="1;1;0.82;1;1;0.9;1"
               keyTimes="0;0.03;0.045;0.06;0.33;0.35;1"
               dur="5.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <g stroke="#7C8CFF" stroke-width="1.6" filter="url(#lineglow)" opacity="0.9">
    <path d="M300 186 L560 186" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" values="0;-240" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M640 186 L900 186" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" values="-240;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M600 172 L590 188 L602 188 L594 204 L612 184 L599 184 Z"
        fill="#C4B5FD" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.6;1;0.55" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <g font-family="'SF Mono','DejaVu Sans Mono',Consolas,monospace" font-size="18"
     text-anchor="middle" fill="#A9BAEC">
    <text x="600" y="248" opacity="0">lead ai engineer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.21;0.245;1"
               dur="13s" repeatCount="indefinite"/></text>
    <text x="600" y="248" opacity="0">vague business problem in, deployed system out
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.46;0.495;1"
               dur="13s" repeatCount="indefinite"/></text>
    <text x="600" y="248" opacity="0">system design is the job. the model is a detail.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.71;0.745;1"
               dur="13s" repeatCount="indefinite"/></text>
    <text x="600" y="248" opacity="0">voice · agents · retrieval · fine-tuning · platform
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.96;0.995;1"
               dur="13s" repeatCount="indefinite"/></text>
  </g>

  <g font-family="'SF Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12"
     fill="#4B5A85" letter-spacing="3">
    <text x="40" y="298">CHENNAI</text>
    <text x="1160" y="298" text-anchor="end">IN / AJANEESHWAR</text>
  </g>
  <rect x="0" y="316" width="1200" height="4" fill="#6C63FF" opacity="0.55"/>
</svg>
